name: Client CI

on:
  pull_request:
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/client-ci.yml"
  push:
    branches: [main]
    paths:
      - "client/**"
      - "shared/**"
      - ".github/workflows/client-ci.yml"

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
